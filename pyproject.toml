[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoxi-service"
version = "1.3.0"
description = "International Service Management ERP Platform (desktop + API foundation)"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.14"
authors = [
    { name = "SMOXI" },
]
keywords = [
    "erp",
    "service-management",
    "pyside6",
    "fastapi",
    "sqlalchemy",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "loguru>=0.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.14",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8",
    "qrcode[pil]>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "httpx>=0.28",
]
production = [
    "smoxi-service[desktop,server]",
]

[project.scripts]
smoxi-service = "run:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
